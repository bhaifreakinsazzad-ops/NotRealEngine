name: NotRealEngine CI Verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Lint, Unit & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint verification
        run: npm run lint

      - name: Unit, Security & SQL RLS Static Tests
        run: npm test

      - name: Production Next.js build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          PAYMENTS_ENABLED: "false"
          NOTIFICATIONS_ENABLED: "false"
          NRE_LAB_AI_ENABLED: "false"
          ENGINE_OS_ENV: production
